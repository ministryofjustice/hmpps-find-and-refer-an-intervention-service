name: Notify Prod Approval Required

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment requiring manual approval
        required: true
        type: string
      run_id:
        description: GitHub Actions run ID used to construct URLs for approvals or deep links
        required: true
        type: string
      gh_to_slack_mapping:
        description: JSON object that maps GitHub usernames to their corresponding Slack user IDs
        required: true
        type: string
    secrets:
      slack_webhook_url:
        description: Slack webhook URL used to send the approval notification message
        required: true

permissions:
  contents: read

jobs:
  notify-prod-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Get PR information
        id: pr-info
        run: |
          COMMIT_SHA="${{ github.sha }}"

          # Query GitHub API for PRs associated with this commit
          PR_INFO=$(gh api \
            repos/${{ github.repository }}/commits/$COMMIT_SHA/pulls \
            --jq '.[0]')

          PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number')
          PR_TITLE=$(echo "$PR_INFO" | jq -r '.title')

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "pr_author=${{ github.actor }}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Map GitHub user to Slack ID
        id: slack-mapping
        run: |
          GITHUB_USERNAME="${{ steps.pr-info.outputs.pr_author }}"
          echo "Mapping GitHub user: $GITHUB_USERNAME"

          MAPPING_JSON=$(echo '${{ inputs.gh_to_slack_mapping }}' | jq -ce '.') || {
            echo "GH_TO_SLACK_MAPPING is not valid JSON"
            exit 1
          }

          SLACK_USER_ID=$(echo "$MAPPING_JSON" | jq -r --arg user "$GITHUB_USERNAME" '.[$user] // "unknown"')

          echo "slack_user_id=$SLACK_USER_ID" >> $GITHUB_OUTPUT
      - name: Generate the Approval link
        id: approval-link
        run: |
          # Create link to the workflow that needs approval 
          APPROVAL_LINK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "Approval Link: $APPROVAL_LINK"
          echo "approval_link=$APPROVAL_LINK" >> $GITHUB_OUTPUT
      - name: Send Slack notification
        run: |
          if [[ -z "${{ secrets.slack_webhook_url }}" ]]; then
            echo "SLACK_WEBHOOK_URL secret is empty"
            exit 1
          fi

          CHANGELOG=$(git log -1 --pretty=%B "${{ github.sha }}")

          PAYLOAD=$(jq -n \
            --arg slack_user_id "${{ steps.slack-mapping.outputs.slack_user_id }}" \
            --arg changelog "$CHANGELOG" \
            --arg github_user "${{ github.actor }}" \
            --arg pr_name "${{ steps.pr-info.outputs.pr_title }}" \
            --arg link "${{ steps.approval-link.outputs.approval_link }}" \
            --arg repo "${{ github.repository }}" \
            --arg timestamp "$(date -u +"%Y-%m-%d %H:%M:%S UTC")" \
            --arg pr_number "${{ steps.pr-info.outputs.pr_number }}" \
            '{
              developer_to_tag_slack_user_id: $slack_user_id,
              deployment_changelog: $changelog,
              github_username: $github_user,
              human_readable_pr_name: $pr_name,
              link_to_approval_step: $link,
              repository: $repo,
              timestamp: $timestamp,
              pr_number: $pr_number
            }'
          )

          echo "Slack payload: $PAYLOAD"

          if curl -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.slack_webhook_url }}" \
            --fail \
            --show-error \
            --silent; then
            echo "Slack notification sent successfully"
          else
            echo "Failed to send Slack notification"
            echo "Please check the GH_TO_SLACK_MAPPING variable for user "${{ github.actor }}" and SLACK_WEBHOOK_URL secret."
            exit 1
          fi
