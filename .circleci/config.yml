version: 2.1
orbs:
  hmpps: ministryofjustice/hmpps@11.2.0
  mem: circleci/rememborb@0.0.2
parameters:
  releases-slack-channel:
    type: string
    default: find-refer-interventions-dev-notification
jobs:
  validate:
    executor:
      name: hmpps/java_localstack_postgres
      jdk_tag: "25.0"
      postgres_tag: "18"
      localstack_tag: "3"
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-{{ checksum "build.gradle.kts" }}
            - gradle-
      - run:
          command: ./gradlew check
      - save_cache:
          paths:
            - ~/.gradle
          key: gradle-{{ checksum "build.gradle.kts" }}
      - run:
          name: Validate metadata
          command: |
            script/validate-metadata.sh
      - store_test_results:
          path: build/test-results
      - store_artifacts:
          path: build/reports/tests
workflows:
  version: 2
